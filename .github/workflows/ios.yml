name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  ios:
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 生成 web 资源并同步 iOS 工程（含 pod install）
        shell: bash
        run: |
          set -o pipefail
          npm run web:copy
          npx cap sync ios 2>&1 | tee ios-sync.log

      - name: 构建未签名 .app
        shell: bash
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: 打包为未签名 IPA
        shell: bash
        run: |
          set -e
          APP_DIR="ios/App/build/Build/Products/Release-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -r -q "$GITHUB_WORKSPACE/pos-ios-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/pos-ios-unsigned.ipa"

      - name: 上传 IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-ios-ipa
          path: pos-ios-unsigned.ipa
          if-no-files-found: ignore

      - name: 上传构建日志（排错用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios-sync.log
            ios/App/xcodebuild.log
          if-no-files-found: ignore
