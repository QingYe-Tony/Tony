name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备 Android SDK（使用 runner 预装的 SDK）
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK 目录: $SDK"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then echo "未找到预装 Android SDK"; exit 1; fi
          SDKMGR_BIN="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          [ -n "$SDKMGR_BIN" ] && export PATH="$SDKMGR_BIN:$PATH"
          export PATH="$SDK/platform-tools:$PATH"
          echo "sdkmanager: $(command -v sdkmanager || echo NOT_FOUND)"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 生成 web 资源并同步到 Android 工程
        run: npm run cap:sync

      - name: 构建 Debug APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: 上传构建日志（排错用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-log
          path: android/gradle-build.log
          if-no-files-found: ignore
