name: Build Tweak
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install required system deps
        run: |
          sudo apt update
          sudo apt install -y perl fakeroot rsync build-essential git

      - name: Clone full Theos (--recursive 拉取子模块，包含 dm.pl)
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build & package tweak
        run: make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
