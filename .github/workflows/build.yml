name: Build Tweak
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git perl fakeroot rsync build-essential curl unzip xz-utils libxml2-dev bzip2

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Fetch toolchain + sdks via install.sh
        run: |
          cd $HOME/theos
          ./install.sh

      - name: Build rootless deb
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
