name: Build Tweak
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git perl fakeroot rsync build-essential xz-utils libxml2-dev

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Git clone sdks repo (proper structure)
        run: |
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build rootless deb
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
